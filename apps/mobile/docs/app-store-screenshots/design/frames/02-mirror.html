<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>02 · Talk (mirror), live</title>
<link rel="stylesheet" href="../kit.css">
<script src="../icons.js"></script>
<script src="../kit.js"></script>
</head>
<body class="shot">
<h1 class="headline">Say it out loud,<br>in the mirror.</h1>

<div class="phone"><div class="phone-clip">
<!-- TalkScreen, live phase — apps/mobile/src/screens/talk.tsx (after "mirror: live")
     and talk-hints.tsx (HintDeck, PhrasePage, UsedMark). Safe area: top 62, bottom 34. -->
<div class="screen dark">

  <!-- MirrorPreview (components/mirror-preview.tsx): the front camera under a 28% scrim.
       The image is optional; without it the container colour shows. -->
  <div class="mirror">
    <img src="../assets/mirror.jpg" alt="" onerror="this.remove()">
    <div class="scrim"></div>
  </div>

  <status-bar tone="light"></status-bar>

  <!-- top bar: back · title + chevron · timer (top = inset 62 + 6) -->
  <div style="position:absolute;top:68px;left:14px;right:14px;flex-direction:row;align-items:center;gap:8px;z-index:20">
    <div style="background:var(--frost);border-radius:20px;width:40px;height:40px;align-items:center;justify-content:center">
      <i-c n="back" s="17" w="2.2" c="#fff"></i-c>
    </div>
    <div style="flex:1;align-items:center;gap:6px">
      <div style="flex-direction:row;align-items:center;gap:5px">
        <p style="color:#fff;font-size:18px;font-weight:700;letter-spacing:-0.2px">Free talk</p>
        <i-c n="chev" s="12" w="2.6" c="rgba(255,255,255,0.85)"></i-c>
      </div>
    </div>
    <p style="font-size:14.5px;font-weight:600;color:#fff;width:44px;text-align:right">01:24</p>
  </div>

  <!-- Recording status pill (top = inset 62 + 56) -->
  <div style="position:absolute;top:118px;left:0;right:0;align-items:center;z-index:12">
    <div style="background:rgba(20,22,28,0.7);border-radius:999px;padding:8px 15px;flex-direction:row;align-items:center;gap:8px">
      <div style="width:8px;height:8px;border-radius:4px;background:#F0453A"></div>
      <p style="font-size:14px;color:#fff;font-weight:600">Listening · keep talking</p>
    </div>
  </div>

  <!-- Live on-device caption (top = inset 62 + 104) -->
  <div style="position:absolute;top:166px;left:22px;right:22px;align-items:center;z-index:11">
    <p style="font-size:17px;line-height:25px;color:#fff;text-align:center;font-weight:500">It took me a while to get the hang of the new workflow, but now I really enjoy it.</p>
  </div>

  <!-- HintDeck (bottom = inset 34 + 132): first page, its phrase just used -->
  <div style="position:absolute;left:14px;right:14px;bottom:166px;z-index:15;background:var(--frost);border-radius:24px;overflow:hidden">
    <!-- PhrasePage -->
    <div style="padding:18px 20px 14px">
      <div style="gap:12px">
        <div style="flex-direction:row;justify-content:space-between">
          <p class="label">TRY USING</p>
          <p class="label" style="color:var(--used)">1 OF 4 USED</p>
        </div>
        <div style="flex-direction:row;align-items:center;gap:14px">
          <p style="flex:1;color:#fff;font-size:22px;line-height:28px;font-weight:600">get the hang of</p>
          <!-- UsedMark, used -->
          <div style="width:28px;height:28px;border-radius:14px;background:var(--used);align-items:center;justify-content:center">
            <i-c n="check" s="15" w="2.8" c="#fff"></i-c>
          </div>
        </div>
        <p style="color:var(--used);font-size:13px">You used it. Nice.</p>
      </div>
    </div>
    <!-- page dots: current is 16 wide; a used phrase's dot is green -->
    <div style="flex-direction:row;justify-content:center;gap:6px;padding-bottom:12px">
      <div class="dot" style="width:16px;background:var(--used)"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <!-- bottom controls: Hint · record indicator · Finish (bottom = inset 34 + 24) -->
  <div style="position:absolute;left:0;right:0;bottom:58px;flex-direction:row;justify-content:center;align-items:flex-end;gap:40px;z-index:15">
    <div style="align-items:center;gap:8px">
      <!-- deck open: the button takes the camera accent -->
      <div style="background:var(--camAcc);width:60px;height:60px;border-radius:30px;align-items:center;justify-content:center">
        <i-c n="bulb" s="24" w="1.9" c="#0D1A3B"></i-c>
        <div style="position:absolute;top:-2px;right:-2px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--used);align-items:center;justify-content:center">
          <p style="color:#fff;font-size:12px;font-weight:700">1</p>
        </div>
      </div>
      <p class="ctl">Hide</p>
    </div>
    <div style="align-items:center;gap:8px;padding-bottom:22px">
      <div style="width:84px;height:84px;border-radius:42px;background:var(--camAcc);align-items:center;justify-content:center;box-shadow:0 16px 28px rgba(0,0,0,0.16)">
        <!-- Wave n=5 h=30 active: each bar is 30 tall, scaled between 0.35 and 1 -->
        <div style="flex-direction:row;gap:3px;align-items:center;height:30px">
          <div class="bar" style="transform:scaleY(0.46)"></div>
          <div class="bar" style="transform:scaleY(0.88)"></div>
          <div class="bar" style="transform:scaleY(0.58)"></div>
          <div class="bar" style="transform:scaleY(1)"></div>
          <div class="bar" style="transform:scaleY(0.7)"></div>
        </div>
      </div>
    </div>
    <div style="align-items:center;gap:8px">
      <div style="background:rgba(28,30,36,0.66);width:60px;height:60px;border-radius:30px;align-items:center;justify-content:center">
        <div style="width:17px;height:17px;border-radius:4px;background:#fff"></div>
      </div>
      <p class="ctl">Finish</p>
    </div>
  </div>

</div>
</div></div>

<style>
  /* Text without its own lineHeight is one Pretendard line: (1950 + 494) / 2048 em. */
  .screen { line-height: 1.1934; --frost: rgba(20,22,28,0.65); --camAcc: #6E8DD5; }
  .mirror { position: absolute; inset: 0; background: #1b1e26; overflow: hidden; }
  .mirror img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mirror .scrim { position: absolute; inset: 0; background: rgba(20,22,28,0.28); }
  /* LABEL in talk-hints.tsx */
  .label { color: #BCC9DF; font-size: 11px; font-weight: 700; letter-spacing: 1px; }
  .dot { width: 6px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.35); }
  .bar { width: 3px; height: 30px; border-radius: 9999px; background: #0D1A3B; }
  .ctl { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,0.85); }
</style>
</body>
</html>
